# Gradle 配置
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Fabric 版本基线（已验证于 26.2）
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.158.0+26.2

# Loom（26.x 非混淆版本，使用 net.fabricmc.fabric-loom 插件 ID）
loom_version=1.17.20

# Mod 自身属性
mod_version=1.0.0
maven_group=com.cinemaforyou
archives_base_name=cinemaforyou

# 第三方依赖
# JavaCV 1.5.13 配套 FFmpeg 8.0.1-1.5.13
javacv_version=1.5.13
ffmpeg_version=8.0.1-1.5.13
# 需要打包原生库的平台
native_platforms=linux-x86_64,linux-arm64,windows-x86_64,macosx-x86_64,macosx-arm64
